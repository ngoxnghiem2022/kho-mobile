<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b5f59">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Kho">
<meta name="format-detection" content="telephone=no">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<title>Kho Mobile</title>
<style>
:root{
  --bg:#eef2f6; --bg2:#e3e9f0; --card:#ffffff; --ink:#0f172a; --mut:#64748b; --line:#e2e8f0;
  --pri:#0f766e; --pri-d:#0b5f59; --pri2:#e6fffb; --pri-ink:#0b5f59;
  --warn:#b45309; --warnbg:#fef3c7; --bad:#b91c1c; --badbg:#fee2e2; --ok:#15803d; --okbg:#dcfce7;
  --tap:#f1f5f9; --shadow:0 1px 2px rgba(15,23,42,.04),0 6px 20px rgba(15,23,42,.06);
  --radius:16px;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#070c16; --bg2:#0b1220; --card:#111a2b; --ink:#e5e7eb; --mut:#94a3b8; --line:#1e293b;
  --pri:#2dd4bf; --pri-d:#0f3b38; --pri2:#0f3b38; --pri-ink:#7ff3e4;
  --warn:#fbbf24; --warnbg:#3a2a0a; --bad:#f87171; --badbg:#3b1414; --ok:#4ade80; --okbg:#052e1b;
  --tap:#1a2437; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35);
}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:linear-gradient(180deg,var(--bg2),var(--bg) 220px);color:var(--ink);
font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
padding-bottom:calc(74px + env(safe-area-inset-bottom));overscroll-behavior-y:contain}
header{position:sticky;top:0;z-index:10;background:linear-gradient(135deg,var(--pri),var(--pri-d));color:#fff;
padding:calc(11px + env(safe-area-inset-top)) 14px 13px;display:flex;align-items:center;gap:10px;
box-shadow:0 6px 18px rgba(11,95,89,.25)}
header .brand{flex:1;min-width:0}
header .brand b{display:block;font-size:16px;font-weight:700;letter-spacing:.2px}
header .brand span{display:block;font-size:12px;opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header .tb{background:rgba(255,255,255,.14);color:#fff;border:1px solid rgba(255,255,255,.32);border-radius:11px;
padding:8px 11px;font:600 13px inherit;backdrop-filter:blur(4px)}
header .tb:active{background:rgba(255,255,255,.28)}
main{padding:14px 13px 6px;max-width:760px;margin:0 auto}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:1px solid var(--line);
padding-bottom:env(safe-area-inset-bottom);z-index:8;box-shadow:0 -6px 20px rgba(15,23,42,.06)}
nav button{flex:1;min-width:0;border:0;background:none;color:var(--mut);padding:9px 1px 8px;font:inherit;font-size:10.5px;
position:relative;display:flex;flex-direction:column;align-items:center;gap:2px}
nav button b{font-size:20px;line-height:1.05;font-weight:400}
nav button.on{color:var(--pri)}
nav button.on::before{content:"";position:absolute;top:4px;width:26px;height:3px;border-radius:3px;background:var(--pri)}
nav button:active{background:var(--tap)}
h2,h3{margin:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin:11px 0;
box-shadow:var(--shadow)}
.card>.head{display:flex;align-items:center;gap:8px;margin-bottom:2px}
.card h3{font-size:15px;font-weight:700;letter-spacing:.1px}
.card .head .sp{flex:1}
.section{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);
margin:16px 4px 4px}
label{display:block;font-size:12.5px;font-weight:600;color:var(--mut);margin:12px 0 5px}
label .req{color:var(--bad)}
input,select,textarea{width:100%;font:16px/1.3 inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);
border-radius:12px;padding:12px 13px;min-height:48px;-webkit-appearance:none;appearance:none;transition:border-color .15s}
input:focus,select:focus,textarea:focus{border-color:var(--pri);outline:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--pri) 18%,transparent)}
input::placeholder{color:color-mix(in srgb,var(--mut) 80%,transparent)}
.btn{border:0;border-radius:12px;padding:13px 16px;font:700 16px/1.1 inherit;background:var(--pri);color:#fff;
min-height:48px;transition:filter .12s,transform .06s}
.btn:active{filter:brightness(.95);transform:translateY(1px)}
.btn.alt{background:var(--pri2);color:var(--pri-ink)}
.btn.ghost{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.btn.bad{background:var(--badbg);color:var(--bad)}
.btn.ok{background:var(--okbg);color:var(--ok)}
.btn.sm{padding:10px 12px;min-height:42px;font-size:14px;border-radius:11px}
.btn:disabled{opacity:.5}
.row{display:flex;gap:9px;align-items:center}
.row>*{flex:1;min-width:0}.row>.fit{flex:none}
.mut{color:var(--mut);font-size:12.5px}
.tot{font-weight:800;font-size:19px;white-space:nowrap;letter-spacing:-.2px}
.code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-weight:700}
.lot{display:flex;gap:10px;align-items:center;padding:10px 0;border-top:1px dashed var(--line)}
.lot:first-child{border-top:0}
.lot .info{flex:1;min-width:0}
.lot .vt{font-weight:700}
.chip{display:inline-block;border-radius:999px;padding:2px 10px;font-size:11.5px;font-weight:600;
background:var(--pri2);color:var(--pri-ink);margin:2px 4px 2px 0;vertical-align:middle}
.chip.warn{background:var(--warnbg);color:var(--warn)}.chip.bad{background:var(--badbg);color:var(--bad)}
.chip.ok{background:var(--okbg);color:var(--ok)}.chip.gray{background:var(--tap);color:var(--mut)}
.seg{display:flex;gap:4px;background:var(--tap);border-radius:12px;padding:4px}
.seg button{flex:1;border:0;background:none;color:var(--mut);font:600 13px inherit;padding:9px 6px;border-radius:9px}
.seg button.on{background:var(--card);color:var(--pri);box-shadow:var(--shadow)}
.filters{display:flex;gap:8px;overflow-x:auto;padding:4px 0;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.filters button{flex:none;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;
padding:8px 14px;font:600 13.5px inherit}
.filters button.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.sheet-bg{position:fixed;inset:0;background:rgba(15,23,42,.5);z-index:20;display:flex;align-items:flex-end;
backdrop-filter:blur(1px)}
.sheet{background:var(--card);width:100%;max-width:760px;margin:0 auto;border-radius:22px 22px 0 0;padding:16px 16px 14px;
max-height:90vh;overflow:auto;padding-bottom:calc(16px + env(safe-area-inset-bottom));box-shadow:0 -10px 40px rgba(0,0,0,.25)}
.sheet .grab{width:40px;height:4px;border-radius:4px;background:var(--line);margin:0 auto 12px}
#toast{position:fixed;left:13px;right:13px;bottom:calc(88px + env(safe-area-inset-bottom));z-index:40;background:#0f172a;color:#fff;
padding:13px 15px;border-radius:13px;display:none;white-space:pre-wrap;box-shadow:0 10px 30px rgba(0,0,0,.35);font-size:14px}
#toast.err{background:var(--bad)}
.login{max-width:370px;margin:9vh auto 0;padding:0 18px}
.login .logo{width:66px;height:66px;border-radius:18px;margin:0 auto 6px;display:grid;place-items:center;
background:linear-gradient(135deg,var(--pri),var(--pri-d));color:#fff;font:800 20px system-ui;box-shadow:var(--shadow)}
.login h2{text-align:center;font-size:20px;margin:6px 0 2px}
.login .sub{text-align:center;color:var(--mut);font-size:13px;margin-bottom:14px}
.scanbox{position:fixed;inset:0;background:#000;z-index:50;display:flex;flex-direction:column}
.scanbox video{flex:1;object-fit:cover;width:100%}
.scanbox .btn{margin:12px}
.scanbox .hint{color:#fff;text-align:center;font-size:13px;padding:8px}
.empty{text-align:center;color:var(--mut);padding:34px 10px;font-size:14px}
.hintline{font-size:12px;color:var(--mut);margin-top:6px;line-height:1.5}
.searchwrap{position:relative}
.searchwrap .clr{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:none;color:var(--mut);
font-size:22px;padding:8px;line-height:1}
.picks{display:flex;gap:7px;flex-wrap:wrap;margin-top:8px}
.picks button{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:8px 13px;font:600 13px inherit;color:var(--ink)}
.pick-hd{font-size:12px;color:var(--mut);margin:10px 2px 0}
.ipick{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.ipick button{display:block;text-align:left;width:100%;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:10px 12px;font:inherit;color:var(--ink)}
.ipick button:active{background:var(--tap)}
.ipick .r1{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.ipick .code{font-family:ui-monospace,Menlo,Consolas,monospace;font-weight:700;font-size:13.5px}
.ipick .dv{color:var(--mut);font-size:12px;white-space:nowrap}
.ipick .vn{display:block;margin-top:2px;font-weight:600;font-size:15px}
.ipick .vn b,.ipick .code b{color:var(--pri)}
.ipick .en{display:block;color:var(--mut);font-size:12px;margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.locbox{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.locrow{display:flex;align-items:center;gap:9px;width:100%;text-align:left;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:10px 12px;font:inherit;color:var(--ink)}
.locrow:active{background:var(--tap)}
.locrow .lc{font-family:ui-monospace,Menlo,Consolas,monospace;font-weight:700;flex:none}
.locrow .ln{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--mut);font-size:13px}
.loctype{font-size:11px;color:var(--mut);border:1px solid var(--line);border-radius:999px;padding:1px 8px;white-space:nowrap;flex:none}
.more{margin-top:8px;text-align:center}
.more button{border:0;background:none;color:var(--pri);font:700 14px inherit;padding:10px}
.spin{display:inline-block;width:16px;height:16px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;
border-radius:50%;animation:sp .7s linear infinite;vertical-align:-3px}
@keyframes sp{to{transform:rotate(360deg)}}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:9px}
/* pick list */
.pickrow{display:flex;gap:10px;align-items:flex-start;padding:11px 0;border-top:1px dashed var(--line)}
.pickrow:first-child{border-top:0}
.pickrow .box{width:24px;height:24px;border-radius:7px;border:2px solid var(--line);flex:none;display:grid;place-items:center;
color:#fff;font-size:14px;margin-top:1px;transition:.15s}
.pickrow.done .box{background:var(--ok);border-color:var(--ok)}
.pickrow.done .info{opacity:.55;text-decoration:line-through}
.pickrow .info{flex:1;min-width:0}
.loc{display:inline-flex;align-items:center;gap:5px;background:var(--pri2);color:var(--pri-ink);border-radius:9px;
padding:3px 9px;font:700 13px ui-monospace,Menlo,Consolas,monospace;margin-bottom:3px}
.qtypill{font-weight:800;font-size:16px}
.stat{display:flex;gap:9px;background:var(--tap);border-radius:12px;padding:10px 12px;margin-top:6px;flex-wrap:wrap}
.stat div{flex:1;min-width:72px}
.stat b{display:block;font-size:17px}
.stat span{font-size:11.5px;color:var(--mut)}
.loc-group{border:1px solid var(--line);border-radius:12px;padding:8px 12px;margin:8px 0}
.loc-group h4{margin:2px 0 4px;font-size:14px;display:flex;align-items:center;gap:6px}
/* màn nhặt hàng toàn màn hình */
.pickscreen{position:fixed;inset:0;z-index:30;background:var(--bg);display:flex;flex-direction:column}
.pickscreen .ph{background:linear-gradient(135deg,var(--pri),var(--pri-d));color:#fff;padding:calc(10px + env(safe-area-inset-top)) 12px 10px}
.pickscreen .ph .t{display:flex;align-items:center;gap:10px}
.pickscreen .ph .t b{flex:1;min-width:0;font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pickscreen .ph .sub{font-size:12.5px;opacity:.9;margin:3px 2px 0}
.pickscreen .bar{height:9px;border-radius:9px;background:rgba(255,255,255,.28);margin-top:9px;overflow:hidden}
.pickscreen .bar i{display:block;height:100%;background:#fff;width:0;transition:width .25s}
.pickscreen .pl{flex:1;overflow:auto;padding:10px 12px 14px;-webkit-overflow-scrolling:touch}
.pickscreen .pf{display:flex;gap:9px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:var(--card);border-top:1px solid var(--line)}
.pickscreen .pf .btn{flex:1}
.pk{display:flex;gap:12px;align-items:center;background:var(--card);border:2px solid var(--line);border-radius:16px;
padding:13px;margin:9px 0;box-shadow:var(--shadow);user-select:none;-webkit-user-select:none}
.pk:active{transform:scale(.99)}
.pk .cb{width:34px;height:34px;border-radius:11px;border:3px solid var(--line);flex:none;display:grid;place-items:center;
color:#fff;font-size:20px;font-weight:800}
.pk .bd{flex:1;min-width:0}
.pk .qt{font-size:26px;font-weight:800;letter-spacing:-.5px;text-align:right;flex:none;line-height:1}
.pk .qt small{display:block;font-size:11px;font-weight:600;color:var(--mut);letter-spacing:0;margin-top:3px}
.pk .nm{font-weight:700;font-size:15px;line-height:1.25}
.pk.done{border-color:var(--ok);background:var(--okbg)}
.pk.done .cb{background:var(--ok);border-color:var(--ok)}
.pk.done .nm,.pk.done .qt{opacity:.6;text-decoration:line-through}
.pk .who{font-size:11.5px;color:var(--ok);font-weight:600;margin-top:2px}
.pk .sug{font-size:12px;color:var(--warn);margin-top:3px;font-weight:600}
.lochd{display:flex;align-items:center;gap:8px;margin:16px 2px 2px;font:800 18px ui-monospace,Menlo,Consolas,monospace;color:var(--pri-ink)}
.lochd span{font:600 12px system-ui;color:var(--mut)}
.pbar{height:7px;border-radius:7px;background:var(--tap);overflow:hidden;margin-top:8px}
.pbar i{display:block;height:100%;background:var(--pri);transition:width .25s}
.pbar.full i{background:var(--ok)}
.allok{background:var(--okbg);color:var(--ok);font-weight:800;text-align:center;padding:12px;border-radius:14px;margin:8px 0}
/* phiếu xuất: nhặt lần lượt */
.doc{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin:2px 0 10px}
.doc .ttl{font-weight:800;font-size:15px;letter-spacing:.5px;text-align:center;color:var(--pri-ink)}
.doc dl{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;margin:8px 0 0;font-size:13.5px}
.doc dt{color:var(--mut)}.doc dd{margin:0;font-weight:600;word-break:break-word}
.nx{background:linear-gradient(135deg,var(--pri),var(--pri-d));color:#fff;border-radius:18px;padding:14px;margin:6px 0 12px;
box-shadow:var(--shadow)}
.nx .tag{font-size:11.5px;font-weight:800;letter-spacing:.08em;opacity:.9}
.nx .lc{font:800 30px/1.15 ui-monospace,Menlo,Consolas,monospace;margin:4px 0 2px;word-break:break-all}
.nx .nm{font-size:17px;font-weight:700;line-height:1.25}
.nx .meta{font-size:12.5px;opacity:.92;margin-top:3px}
.nx .q{font-size:38px;font-weight:800;line-height:1;margin:10px 0 2px}
.nx .q small{font-size:15px;font-weight:700;opacity:.9;margin-left:4px}
.nx .btn{width:100%;background:#fff;color:var(--pri-d);margin-top:10px;font-size:18px;min-height:56px}
.nx .skip{font-size:12px;opacity:.85;margin-top:8px}
.tbl{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--card)}
.tbl .th,.tbl .pr{display:grid;grid-template-columns:34px 1fr auto;gap:10px;align-items:center;padding:10px 12px}
.tbl .th{background:var(--tap);font-size:11.5px;font-weight:800;color:var(--mut);text-transform:uppercase;letter-spacing:.04em}
.tbl .pr{border-top:1px solid var(--line)}
.tbl .pr:active{background:var(--tap)}
.tbl .pr .no{width:30px;height:30px;border-radius:50%;background:var(--tap);display:grid;place-items:center;font-weight:800;font-size:13px}
.tbl .pr .nm{font-weight:700;font-size:14.5px;line-height:1.25}
.tbl .pr .lc{font:800 13px ui-monospace,Menlo,Consolas,monospace;color:var(--pri-ink);text-align:right}
.tbl .pr .q{font-weight:800;font-size:18px;text-align:right}
.tbl .pr.cur{background:var(--pri2);box-shadow:inset 4px 0 0 var(--pri)}
.tbl .pr.cur .no{background:var(--pri);color:#fff}
.tbl .pr.done{opacity:.55}
.tbl .pr.done .no{background:var(--ok);color:#fff}
.tbl .pr.done .nm{text-decoration:line-through}
/* ===== v21: giao diện gọn, ngón cái với tới ===== */
:root{--hh:56px}
header{padding:calc(8px + env(safe-area-inset-top)) 12px 9px}
header .brand b{font-size:17px}
header .tb{padding:7px 11px;font-size:15px;min-height:38px}
.stickybar{position:sticky;top:var(--hh);z-index:6;background:linear-gradient(180deg,var(--bg) 82%,transparent);padding:8px 0 6px;margin:-6px 0 0}
.sumbar{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--mut);margin:10px 4px 6px;font-weight:600}
.plist{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:var(--shadow)}
.pgroup{border-top:1px solid var(--line)}
.pgroup:first-child{border-top:0}
.prow{display:flex;gap:10px;align-items:center;padding:10px 12px;cursor:pointer}
.prow:active{background:var(--tap)}
.prow .pm{flex:1;min-width:0}
.prow .pn{font-weight:650;font-size:14.5px;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.prow .pc{font-size:12px;color:var(--mut);margin-top:3px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.prow .pq{text-align:right;font-weight:800;font-size:18px;line-height:1.05;flex:none;letter-spacing:-.3px}
.prow .pq small{display:block;font-size:11px;font-weight:600;color:var(--mut);letter-spacing:0}
.prow .pq.zero{color:var(--mut)}
.prow .arr{color:var(--mut);transition:transform .15s;flex:none;font-size:18px}
.pgroup.open .arr{transform:rotate(90deg)}
.pdet{display:none;background:var(--tap);padding:2px 12px 8px;border-top:1px dashed var(--line)}
.pgroup.open .pdet{display:block}
.pdet .lot{padding:8px 0}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;flex:none}
.dot.bad{background:var(--bad)}.dot.warn{background:#f59e0b}
.actbar{position:fixed;left:0;right:0;bottom:calc(62px + env(safe-area-inset-bottom));z-index:7;padding:10px 12px 8px;
background:linear-gradient(180deg,transparent,var(--bg) 38%);pointer-events:none}
.actbar .btn{pointer-events:auto;width:100%;max-width:736px;margin:0 auto;display:block;font-size:17px;min-height:54px;
box-shadow:0 10px 26px rgba(11,95,89,.38)}
.pad-act{height:84px}
.vday{font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);margin:16px 4px 6px}
.vrow{display:flex;gap:11px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:14px;
padding:11px 12px;margin:7px 0;box-shadow:var(--shadow);cursor:pointer}
.vrow:active{background:var(--tap)}
.vrow .vic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-size:20px;background:var(--pri2);flex:none}
.vrow .vb{flex:1;min-width:0}
.vrow .vtitle{font-weight:700;font-size:15px;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.vrow .vmeta{font-size:12px;color:var(--mut);margin-top:2px}
.vrow .vq{font-weight:800;font-size:15px;text-align:right;flex:none}
.tplbar{display:flex;gap:8px;overflow-x:auto;padding:2px 0 4px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.tplbar::-webkit-scrollbar{display:none}
.tpl{flex:none;display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);
border-radius:999px;padding:9px 14px;font:700 13.5px inherit;min-height:40px}
.tpl.on{background:var(--pri);border-color:var(--pri);color:#fff}

.abanner b{font-size:18px}

.seg button{white-space:nowrap;font-size:12.5px;padding:9px 3px}
.kgrp{background:var(--card);border:1px solid var(--line);border-radius:14px;margin:8px 0;overflow:hidden}
.kgrp>.ghd{display:flex;gap:11px;align-items:center;padding:11px 12px;cursor:pointer}

.relbar{margin-top:8px}

.tbadge{display:inline-block;font:800 10.5px system-ui;letter-spacing:.06em;padding:3px 8px;border-radius:7px;vertical-align:middle;margin-right:7px;color:#fff}
.tbadge.p{background:#0f766e}.tbadge.k{background:#d97706}.tbadge.v{background:#64748b}
.kgrp>.ghd{border-left:6px solid #0f766e}
.kgrp.single>.ghd{border-left-color:#64748b}

.tree-hint span{white-space:nowrap}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script>
"use strict";
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt = n => (Math.round(Number(n) * 1000) / 1000).toLocaleString("vi-VN");
const today = () => new Date().toLocaleDateString("sv-SE");
const addDays = n => { const d = new Date(); d.setDate(d.getDate() + n); return d.toLocaleDateString("sv-SE"); };
const debounce = (f, ms = 300) => { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => f(...a), ms); }; };
// Ô nhập số: dùng type="text" (tránh lỗi <input type=number> kẹt bàn phím trong trình duyệt trong app / WebView),
// lọc ký tự cho phép tại đây để chắc chắn gõ được số trên mọi máy.
document.addEventListener("input", e => {
  const t = e.target;
  if (!t || !t.matches || !t.matches("input[data-num]")) return;
  let v = String(t.value).replace(/[^\d.,]/g, "").replace(/,/g, ".");
  const i = v.indexOf(".");
  if (i >= 0) v = v.slice(0, i + 1) + v.slice(i + 1).replace(/\./g, "");
  if (v !== t.value) t.value = v;
}, true);

// mã hàng dùng gần đây (lưu trên máy) – chạm là chọn, khỏi gõ lại
const RECENT_KEY = "kho_recent";
function recentList() { try { return JSON.parse(localStorage.getItem(RECENT_KEY) || "[]"); } catch { return []; } }
function pushRecent(ma) { try { localStorage.setItem(RECENT_KEY, JSON.stringify([ma, ...recentList().filter(x => x !== ma)].slice(0, 10))); } catch {} }
function renderRecent(box, onPick, onlyStock) {
  if (!box) return;
  const list = recentList().filter(ma => itemView(ma) && (!onlyStock || S.inStock.has(ma))).slice(0, 8);
  box.innerHTML = list.length ? `<div class="pick-hd">Dùng gần đây</div><div class="picks">${list.map(ma =>
    `<button type="button" data-r="${esc(ma)}"><span class="code">${esc(ma)}</span></button>`).join("")}</div>` : "";
  box.querySelectorAll("[data-r]").forEach(b => b.onclick = () => onPick(b.dataset.r));
}

const APP_VER = "v29";   // đổi số này mỗi khi cập nhật để biết máy đã lấy bản mới chưa
const cfg = window.WMS_CONFIG;
if (!cfg || !cfg.url || !cfg.anonKey) {
  document.getElementById("app").innerHTML = `<div class="login"><div class="logo">KHO</div>
    <h2>Kho Mobile</h2><div class="sub">Chưa cấu hình kết nối</div>
    <p class="mut">Mở file <b>config.js</b> và điền <b>url</b> + <b>anonKey</b> của Supabase.</p></div>`;
  throw new Error("missing WMS_CONFIG");
}
const sb = supabase.createClient(cfg.url, cfg.anonKey);

const PAGE = 60;
const TABS = [["ton","🔎","Tồn kho"],["nhap","📥","Nhập"],["xuat","📤","Xuất"],["nhat","📄","PXK"],["kk","✅","Kiểm kê"],["phieu","🧾","Phiếu"]];
const LS_ME = "kho_me";
const S = {
  tab: "ton", me: null, isAdmin: false,
  items: [], locs: [], custs: [], warnDays: 30, chuyDays: 90, xuatRule: "FIFO",
  q: "", viTri: "", filter: "all", sums: [], by: {}, offset: 0, loading: false,
  vFilter: "all", vOffset: 0,
  draft: [],                       // phiếu nháp NHẬP
  order: [],                       // phiếu nháp XUẤT {ma_hang, sl}
  kk: { vts: [], locs: {}, confirmed: false },
};
const TTL_MS = 5 * 60 * 1000;

// ------------------------------------------------------------------ tiện ích
function toast(msg, err) {
  const t = $("#toast"); t.textContent = msg; t.className = err ? "err" : ""; t.style.display = "block";
  clearTimeout(toast.t); toast.t = setTimeout(() => t.style.display = "none", err ? 7000 : 2600);
  if (navigator.vibrate) navigator.vibrate(err ? [40, 60, 40] : 15);
}
async function rpc(fn, args) { const { data, error } = await sb.rpc(fn, args); if (error) throw new Error(error.message); return data; }
async function must(q) { const { data, error } = await q; if (error) throw new Error(error.message); return data; }
function busy(btn, on, label) {
  if (!btn) return;
  if (on) { btn.disabled = true; btn.dataset.txt = btn.innerHTML; btn.innerHTML = `<span class="spin"></span> ${label || "Đang lưu…"}`; }
  else if (btn.dataset.txt) { btn.disabled = false; btn.innerHTML = btn.dataset.txt; }
}
const vibrate = p => navigator.vibrate && navigator.vibrate(p);
function renderItemSuggest(box, raw, onPick, onlyStock) {
  const v = raw.trim(); const q = v.toLowerCase(); const it = itemView(v.toUpperCase());
  if (!q) { box.innerHTML = ""; return; }
  if (it && (!onlyStock || S.inStock.has(it.ma))) { box.innerHTML = ""; return; }
  const pool = onlyStock ? S.items.filter(i => S.inStock.has(i.ma)) : S.items;
  const pk = quickPicks(pool, ["ma", "ten", "ten_vn"], q, 8);
  if (!pk.length) { box.innerHTML = `<div class="hintline" style="margin-top:8px">${onlyStock ? "Không có mã nào đang có tồn khớp." : "Không tìm thấy mã / tên phù hợp — kiểm tra lại."}</div>`; return; }
  box.innerHTML = `<div class="pick-hd">Chọn mặt hàng</div><div class="ipick">` +
    pk.map(p => {
      const vn = vnName(p);
      return `<button type="button" data-pick="${esc(p.ma)}">
        <span class="r1"><span class="code">${hlText(p.ma, q)}</span><span class="dv">${esc(p.dvt || "")}${onlyStock ? " · tồn " + fmt(S.inStock.get(p.ma) || 0) : ""}</span></span>
        <span class="vn">${hlText(vn, q)}</span></button>`;
    }).join("") + `</div>`;
  box.querySelectorAll("[data-pick]").forEach(b => b.onclick = () => onPick(b.dataset.pick));
}
function hlText(s, q) {
  s = String(s || ""); if (!q) return esc(s);
  const i = s.toLowerCase().indexOf(q);
  if (i < 0) return esc(s);
  return esc(s.slice(0, i)) + "<b>" + esc(s.slice(i, i + q.length)) + "</b>" + esc(s.slice(i + q.length));
}
// ------ vị trí: gợi ý có MÃ + TÊN + loại, gõ/quét để lọc (tối ưu cho điện thoại)
function locName(l) { return String((l && l.ghi_chu) || "").trim(); }
function locLabel(l) {
  if (!l) return "";
  const nm = locName(l);
  return l.ma + (nm && nm !== l.ma ? " · " + nm : "");
}
function locMatches(q) {
  q = (q || "").trim().toLowerCase();
  const f = S.locs.filter(l => !q || l.ma.toLowerCase().includes(q) || locName(l).toLowerCase().includes(q));
  f.sort((a, b) => {
    const am = a.ma.toLowerCase() === q ? 0 : (a.ma.toLowerCase().startsWith(q) ? 1 : 2);
    const bm = b.ma.toLowerCase() === q ? 0 : (b.ma.toLowerCase().startsWith(q) ? 1 : 2);
    return am - bm || a.ma.localeCompare(b.ma, "vi");
  });
  return f;
}
function renderLocSuggest(box, raw, onPick) {
  if (!box) return;
  const q = (raw || "").trim().toLowerCase();
  const list = locMatches(q).slice(0, q ? 12 : 8);
  if (!list.length) {
    box.innerHTML = q ? `<div class="hintline" style="margin-top:6px">Chưa có vị trí khớp — cứ gõ mã mới, hệ thống tự tạo khi nhập.</div>` : "";
    return;
  }
  box.innerHTML = `<div class="locbox">` + list.map(l =>
    `<button type="button" class="locrow" data-loc="${esc(l.ma)}">
      <span class="lc">${hlText(l.ma, q)}</span>
      <span class="ln">${esc(locName(l) || "")}</span></button>`).join("") + `</div>`;
  box.querySelectorAll("[data-loc]").forEach(b => b.onclick = () => onPick(b.dataset.loc));
}
function attachLoc(input, box, onPick) {
  if (!input) return;
  const run = () => renderLocSuggest(box, input.value, ma => { input.value = ma; box.innerHTML = ""; if (onPick) onPick(ma); else input.blur(); });
  input.oninput = run;
  input.onfocus = run;
}
function withSearch(items, keys, q) {
  const f = items.filter(x => keys.some(k => String(x[k] || "").toLowerCase().includes(q)));
  f.sort((a, b) => {
    const am = String(a[keys[0]] || "").toLowerCase() === q ? 0 : 1, bm = String(b[keys[0]] || "").toLowerCase() === q ? 0 : 1;
    return am - bm || String(a[keys[0]] || "").localeCompare(String(b[keys[0]] || ""), "vi");
  });
  return f;
}
function quickPicks(items, keys, q, n = 6) {
  if (!q) return [];
  const s = items.filter(x => keys.some(k => String(x[k] || "").toLowerCase().startsWith(q)));
  return (s.length ? s : withSearch(items, keys, q)).slice(0, n);
}
// tra mã không phân biệt hoa/thường (có mã như "Roasted Chicken"); luôn dùng it.ma (mã gốc) khi ghi phiếu
const itemView = ma => { const k = String(ma || "").trim(); if (!k) return undefined;
  return S.items.find(i => i.ma === k) || S.items.find(i => String(i.ma).trim().toLowerCase() === k.toLowerCase()); };
const vnName = o => ((o && (o.ten_vn || "").trim()) || (o && o.ten) || "");
// Nguyên thùng / lẻ theo quy cách (số lượng mỗi thùng) của mã hàng. VD 550 cái, 20 cái/thùng = 27 thùng + 10 lẻ
const qcOf = ma => Number((itemView(ma) || {}).quy_cach) || 0;
function packOf(ma, sl) {
  const qc = qcOf(ma), q = Number(sl) || 0;
  if (!(qc > 1) || q < qc - 1e-9) return null;
  const t = Math.floor(q / qc + 1e-9), le = Math.round((q - t * qc) * 1e6) / 1e6;
  return { qc, t, le };
}
function packTxt(ma, sl) {
  const p = packOf(ma, sl);
  return p ? `<b style="color:var(--ink)">${fmt(p.t)} thùng</b>${p.le ? " + " + fmt(p.le) + " lẻ" : " nguyên"} <span style="opacity:.75">(1 thùng = ${fmt(p.qc)})</span>` : "";
}
const nameOf = (ma, fb) => { const it = itemView(ma); return vnName(it) || fb || ""; };
const ruleName = { FIFO: "FIFO · nhập trước xuất trước", FEFO: "FEFO · hạn dùng gần nhất trước", LIFO: "LIFO · nhập sau xuất trước" };

// ------------------------------------------------------------------ đăng nhập / khởi động
async function boot() {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) return renderLogin();
  await startApp(session);
}
async function startApp(session) {
  try {
    const prof = await must(sb.from("profiles").select("id,username,ho_ten,vai_tro,active").eq("id", session.user.id).maybeSingle());
    if (!prof || !prof.active) { await sb.auth.signOut(); renderLogin(true); return toast("Tài khoản chưa được cấp quyền.", true); }
    S.me = prof; S.isAdmin = prof.vai_tro === "admin";
    localStorage.setItem(LS_ME, JSON.stringify({ username: prof.username, ho_ten: prof.ho_ten, vai_tro: prof.vai_tro }));
    await loadRef();
  } catch (e) { renderLogin(true); toast(e.message, true); }
}
const cachedMe = () => { try { return JSON.parse(localStorage.getItem(LS_ME) || "null"); } catch { return null; } };

let _refAt = 0;
async function loadRef() {
  const [items, locs, custs, setRows, stk] = await Promise.all([
    must(sb.from("items").select("ma,ten,ten_vn,dvt,ton_toi_thieu,han_dung,quy_cach").order("ma")),
    must(sb.from("locations").select("ma,ghi_chu,cha,kien,loai").eq("active", 1).order("ma")),
    must(sb.from("customers").select("ma,ten").order("ten")),
    must(sb.from("settings").select("key,value").in("key", ["hsd_canh_bao", "hsd_chu_y", "nguyen_tac_xuat", "canh_bao_pct", "kk_start"])),
    must(sb.from("v_stock_tong").select("ma,tong").gt("tong", 0)),
  ]);
  Object.assign(S, { items, locs, custs, inStock: new Map((stk || []).map(r => [r.ma, Number(r.tong)])) });
  const g = Object.fromEntries((setRows || []).map(r => [r.key, r.value]));
  S.warnDays = Number(g.hsd_canh_bao) || 30;
  S.chuyDays = Number(g.hsd_chu_y) || 90;
  S.xuatRule = g.nguyen_tac_xuat || "FIFO";
  S.pct0 = Number(g.canh_bao_pct) || 70;
  S.kkStart = g.kk_start || (() => { const d = new Date(); return new Date(d.getFullYear(), d.getMonth(), 1).toLocaleDateString("sv-SE"); })();
  S.pct = Number((() => { try { return localStorage.getItem("kho_pct"); } catch { return ""; } })()) || S.pct0;
  S.dateCache = null;
  _refAt = Date.now();
  if (!S._shelled) { S._shelled = true; shell(); } else refreshCurrent();
}
function refreshRef(force) { if (force || Date.now() - _refAt > TTL_MS) loadRef().catch(() => {}); }

// ------------------------------------------------------------------ khung
function renderLogin(force) {
  if (!force && cachedMe()) return renderQuickOpen(cachedMe());
  $("#app").innerHTML = `<div class="login"><div class="logo">KHO</div>
    <h2>Kho Mobile</h2><div class="sub">Quản lý kho trên điện thoại</div>
    <div class="card" style="margin-top:0">
    <label>Tên đăng nhập</label><input id="u" autocapitalize="none" autocorrect="off" spellcheck="false" autocomplete="username" enterkeyhint="next">
    <label>Mật khẩu</label><input id="p" type="password" autocapitalize="none" autocorrect="off" autocomplete="current-password" enterkeyhint="go">
    <p><button class="btn" style="width:100%" id="go">Đăng nhập</button></p></div>
    ${isStandalone() ? "" : `<p style="text-align:center"><button class="btn ghost" id="inst-l" style="width:100%">📲 Cài app về máy</button></p>`}
    <p class="hintline" style="text-align:center">Chỉ cần gõ tên đăng nhập (VD <i>lead1</i>) · ${APP_VER}</p>
    <p class="hintline" style="text-align:center">⚠ Nếu bấm vào ô mà <b>không hiện bàn phím</b>: đang mở trong app (Telegram/Zalo/Facebook). Hãy mở bằng <b>Chrome</b> (Android) / <b>Safari</b> (iPhone) — hoặc <b>⋯ → Mở bằng trình duyệt</b>.</p></div>`;
  const go = async () => {
    const u = $("#u").value.trim().toLowerCase(), p = $("#p").value;
    if (!u || !p) return;
    busy($("#go"), true, "Đang vào…");
    const email = u.includes("@") ? u : `${u}@kho.local`;   // chấp nhận cả "ten" lẫn "ten@kho.local"
    const { error } = await sb.auth.signInWithPassword({ email, password: p });
    if (error) {
      busy($("#go"), false);
      return toast(/invalid login|credentials/i.test(error.message)
        ? "Sai tên đăng nhập hoặc mật khẩu (hoặc tài khoản chưa được tạo trên Supabase)."
        : "Lỗi đăng nhập: " + error.message, true);
    }
    startApp((await sb.auth.getSession()).data.session);
  };
  $("#go").onclick = go;
  if ($("#inst-l")) $("#inst-l").onclick = doInstall;
  $("#u").onkeydown = e => { if (e.key === "Enter") $("#p").focus(); };
  $("#p").onkeydown = e => { if (e.key === "Enter") go(); };
}
function renderQuickOpen(me) {
  $("#app").innerHTML = `<div class="login"><div class="logo">KHO</div>
    <h2>Kho Mobile</h2><div class="sub">Xin chào trở lại</div>
    <div class="card" style="margin-top:0"><div class="head"><div>
      <h3>${esc(me.ho_ten || me.username)}</h3>
      <div class="mut">${esc(me.username)} · ${me.vai_tro === "admin" ? "Quản trị" : "Nhân viên"}</div></div></div>
      <p><button class="btn" style="width:100%" id="reenter">Mở lại phiên</button></p></div>
    <p style="text-align:center"><button class="btn ghost" id="other" style="width:100%">Đăng nhập tài khoản khác</button></p></div>`;
  $("#reenter").onclick = async () => {
    busy($("#reenter"), true, "Đang mở…");
    const { data: { session } } = await sb.auth.getSession();
    if (session) startApp(session); else renderLogin(true);
  };
  $("#other").onclick = () => { localStorage.removeItem(LS_ME); renderLogin(true); };
}
function shell() {
  $("#app").innerHTML = `<header>
    <div class="brand"><b id="title">Kho</b><span id="sub"></span></div>
    <button class="tb" id="install" style="display:none" title="Cài app về máy">📲</button>
    <button class="tb" id="menu" aria-label="Menu">☰</button></header>
    <main id="main"></main>
    <nav>${TABS.map(([k, i, t]) => `<button data-t="${k}"><b>${i}</b>${t}</button>`).join("")}</nav>`;
  $("#sub").textContent = `${S.me.ho_ten || S.me.username} · ${S.isAdmin ? "Quản trị" : "Nhân viên"}`;
  $("#install").style.display = isStandalone() ? "none" : "inline-block";
  $("#install").onclick = doInstall;
  document.documentElement.style.setProperty("--hh", $("header").offsetHeight + "px");

async function scanInto(input, onValue) {
  if (!("BarcodeDetector" in window)) return toast("Trình duyệt chưa hỗ trợ quét mã – hãy gõ tay.", true);
  let stream;
  try { stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: "environment" } } }); }
  catch { return toast("Không mở được camera. Cần HTTPS và cho phép truy cập camera.", true); }
  const box = document.createElement("div"); box.className = "scanbox";
  box.innerHTML = `<video playsinline autoplay muted></video><div class="hint">Đưa mã vào giữa khung hình…</div><button class="btn alt">Đóng</button>`;
  document.body.append(box);
  const video = $("video", box); video.srcObject = stream;
  const det = new BarcodeDetector(); let live = true;
  const stop = () => { live = false; stream.getTracks().forEach(t => t.stop()); box.remove(); };
  $("button", box).onclick = stop;
  (async function loop() {
    while (live) {
      try { const r = await det.detect(video);
        if (r.length) { const v = r[0].rawValue; input.value = v; input.dispatchEvent(new Event("input", { bubbles: true })); vibrate(30); stop(); onValue && onValue(v); return; }
      } catch {}
      await new Promise(r => setTimeout(r, 220));
    }
  })();
}

async function fetchDateLots() {
  if (S.dateCache && Date.now() - S.dateCache.at < 5 * 60 * 1000) return S.dateCache.rows;
  const out = []; let from = 0;
  for (;;) {
    const rows = await must(sb.from("v_stock").select("*").neq("hsd", "").gt("sl", 0).order("hsd").range(from, from + 999));
    out.push(...rows); if (rows.length < 1000) break; from += 1000;
  }
  const t0 = today();
  const rows = out.map(l => {
    const it = itemView(l.ma_hang); let total = Number(it && it.han_dung) || 0;
    if (!total && l.nsx) { const n = Math.round((new Date(l.hsd + "T00:00:00") - new Date(l.nsx + "T00:00:00")) / 864e5); if (n > 0) total = n; }
    const con = Math.floor((new Date(l.hsd + "T00:00:00") - new Date(t0 + "T00:00:00")) / 864e5);
    return { ...l, con, total, pct: total ? Math.max(0, Math.round(100 * con / total)) : null };
  });
  S.dateCache = { at: Date.now(), rows };
  return rows;
}

// ------------------------------------------------------------------ PHÂN BỔ LÔ (FIFO/FEFO/LIFO) — giống app PC
function lotCmp(rule) {
  return (a, b) => {
    const hsA = a.hsd || "9999-12-31", hsB = b.hsd || "9999-12-31";
    const nnA = a.ngay_nhap || "9999-12-31", nnB = b.ngay_nhap || "9999-12-31";
    if (rule === "FEFO") return hsA.localeCompare(hsB) || nnA.localeCompare(nnB) || (a.id - b.id);
    if (rule === "LIFO") return nnB.localeCompare(nnA) || (b.id - a.id);
    return nnA.localeCompare(nnB) || hsA.localeCompare(hsB) || (a.id - b.id);
  };
}
async function allocateOrder(lines) {
  const codes = [...new Set(lines.map(l => l.ma_hang))];
  const lots = await must(sb.from("v_stock").select("*").in("ma_hang", codes).gt("sl", 0));
  const by = {}; lots.forEach(l => (by[l.ma_hang] ||= []).push(l));
  const cmp = lotCmp(S.xuatRule);
  const out = [], thieu = [];
  for (const ln of lines) {
    let need = Number(ln.sl);
    const avail = (by[ln.ma_hang] || []).filter(l => !(l.hsd && l.hsd < today())).sort(cmp);
    const picks = [];
    for (const l of avail) {
      if (need <= 1e-9) break;
      const take = Math.min(Number(l.sl), need);
      picks.push({ ...l, take }); need -= take;
    }
    out.push({ ma_hang: ln.ma_hang, ten: (itemView(ln.ma_hang) || {}).ten, need: Number(ln.sl), picks, thieu: Math.max(0, need) });
    if (need > 1e-9) thieu.push({ ma_hang: ln.ma_hang, thieu: need });
  }
  return { out, thieu };
}
function allocToLines(out) {
  const lines = [];
  out.forEach(o => o.picks.forEach(p => lines.push({ ma_hang: o.ma_hang, lo: p.lo, nsx: p.nsx, hsd: p.hsd, vi_tri: p.vi_tri, sl: p.take })));
  return lines;
}

  const da = (S.order.find(l => l.ma_hang === it.ma) || {}).sl || 0;
  const sl = Number(($("#sl") || {}).value) || 0;
  const con = tong - da - sl;
  tip.innerHTML = `<div style="font-weight:700;margin:2px 0 4px">${esc(vnName(it))}</div>

function addOrderLine() {

async function loadVouchers(append) {

  try {

      if (S.vFilter !== "all") qq = qq.eq("loai", S.vFilter);
      return qq;
    };
    let vs;
    try { vs = await must(build("*, voucher_lines(count)")); } catch { vs = await must(build("*")); }

    ${groups[ma].map((l, k) => {

      const q = fmt(l.sl_thuc_te ?? l.sl);
      return `<div class="pickrow ${done}" data-k="${esc(key)}"><div class="box">✓</div><div class="info">
        ${l.vi_tri ? `<span class="loc">📍 ${esc(l.vi_tri)}</span>${l.vi_tri_den ? ` <span class="loc" style="background:var(--warnbg);color:var(--warn)">→ ${esc(l.vi_tri_den)}</span>` : ""}` : ""}
        <div><b>${q}</b>${l.lo ? " · lô " + esc(l.lo) : ""}${l.hsd ? " · HSD " + esc(l.hsd) : ""}${l.sl_so_sach != null && v.loai === "KK" ? " · sổ sách " + fmt(l.sl_so_sach) : ""}</div>

  sheet(head + body +

const DOC_TITLE = { XUAT: "PHIẾU XUẤT KHO", NHAP: "PHIẾU NHẬP KHO", CHUYEN: "PHIẾU CHUYỂN VỊ TRÍ", KK: "BIÊN BẢN KIỂM KÊ", DOI: "PHIẾU ĐỔI HÀNG" };
// Phiếu dạng bảng, CHỈ ĐỂ XEM: mã hàng, tên hàng, vị trí, số lượng, HSD. Mỗi vị trí 1 dòng (cùng mã ở 2 vị trí = 2 dòng).
async function openPickScreen(v, lines) {
  const old = $(".pickscreen"); if (old) old.remove();
  const sug = {};
  const un = v.loai === "XUAT" ? lines.filter(l => !l.vi_tri) : [];
  if (un.length) {   // phiếu nháp chưa có vị trí: gợi ý lấy ở đâu (tách thành nhiều dòng nếu nhiều vị trí)
    try { const a = await allocateOrder(un.map(l => ({ ma_hang: l.ma_hang, sl: l.sl })));
      a.out.forEach((o, i) => { sug[un[i].id] = o.picks; }); } catch {}
  }
  const rows = [];
  lines.forEach(l => {
    const s2 = sug[l.id];
    if (!l.vi_tri && s2 && s2.length) s2.forEach(p => rows.push({ ma_hang: l.ma_hang, vi_tri: p.vi_tri, sl: p.take, lo: p.lo, hsd: p.hsd, goiy: true, nn: p.ngay_nhap || "" }));
    else rows.push({ ma_hang: l.ma_hang, vi_tri: l.vi_tri || "", den: l.vi_tri_den && l.vi_tri_den !== l.vi_tri ? l.vi_tri_den : "", nhan: v.loai === "DOI" ? l.sl_nhan : null,
      sl: v.loai === "KK" ? (l.sl_thuc_te ?? l.sl) : l.sl, so_sach: v.loai === "KK" ? l.sl_so_sach : null, lo: l.lo, hsd: l.hsd, gc: l.ghi_chu, nn: l.ngay_nhap || "", hm: l.hsd_moi || "", nm: l.nsx_moi || "" });
  });
  // ngày nhập của lô: ưu tiên ngày đã lưu trên dòng phiếu; chưa có thì tra theo tồn hiện tại rồi thẻ kho
  if (v.loai !== "NHAP") {
    const miss = rows.filter(r => !r.nn);
    if (miss.length) {
      try {
        const codes = [...new Set(miss.map(r => r.ma_hang))];
        const key3 = r => [r.ma_hang, r.lo || "", r.hsd || ""].join("|");
        const st = await must(sb.from("v_stock").select("ma_hang,lo,hsd,vi_tri,ngay_nhap").in("ma_hang", codes));
        const byStock = {}; st.forEach(x => { byStock[[x.ma_hang, x.lo || "", x.hsd || "", x.vi_tri || ""].join("|")] = x.ngay_nhap; });
        const lg = await must(sb.from("ledger").select("ma_hang,lo,hsd,ngay").in("ma_hang", codes).eq("loai", "NHAP").gt("sl_nhap", 0).order("ngay"));
        const byLedger = {}; lg.forEach(x => { const k = [x.ma_hang, x.lo || "", x.hsd || ""].join("|"); if (!byLedger[k]) byLedger[k] = x.ngay; });
        miss.forEach(r => { r.nn = byStock[[r.ma_hang, r.lo || "", r.hsd || "", r.vi_tri || ""].join("|")] || byLedger[key3(r)] || ""; });
      } catch {}
    }
  }
  if (v.loai === "NHAP") rows.reverse();   // phiếu nhập: dòng nhập sau hiện trước
  else rows.sort((a, b) => (!a.vi_tri - !b.vi_tri) || natCmp(a.vi_tri, b.vi_tri) || natCmp(a.ma_hang, b.ma_hang) ||
    String(a.hsd || "9999").localeCompare(String(b.hsd || "9999")));
  const total = rows.reduce((a, r) => a + Number(r.sl || 0), 0);
  const dvt = ma => (itemView(ma) || {}).dvt || "";
  const who = v.loai === "XUAT" ? "Nơi nhận" : (v.loai === "NHAP" ? "Nhà cung cấp" : "Đối tác");
  const me = (S.me.ho_ten || S.me.username || "");
  const canDelete = S.isAdmin || ((v.nguoi_lap || "") === me && v.ngay === today());
  const draft = v.trang_thai && v.trang_thai !== "Đã ghi sổ";

  const el = document.createElement("div"); el.className = "pickscreen";
  el.innerHTML = `<div class="ph"><div class="t"><button class="tb btn sm fit" id="pback" style="background:rgba(255,255,255,.16);color:#fff;min-height:38px">‹ Quay lại</button>
      <b>${esc(DOC_TITLE[v.loai] || "PHIẾU")}</b></div></div>
    <div class="pl">
      <div class="doc"><div class="ttl">${esc(DOC_TITLE[v.loai] || "PHIẾU")}</div>
        ${v.ghi_chu ? `<div class="dname">${esc(v.ghi_chu)}</div>` : ""}<dl>
        <dt>Số phiếu</dt><dd class="code">${esc(v.so)}</dd>
        <dt>Ngày</dt><dd>${esc(v.ngay)}</dd>
        ${v.doi_tac ? `<dt>${who}</dt><dd>${esc(v.doi_tac)}</dd>` : ""}
        <dt>Người lập</dt><dd>${esc(v.nguoi_lap || "—")}</dd>
        <dt>Tổng cộng</dt><dd>${rows.length} dòng · SL ${fmt(total)}</dd></dl>
        ${draft ? `<div style="margin-top:8px"><span class="chip warn">${esc(v.trang_thai)} (chưa ghi sổ trên máy tính)</span></div>` : ""}</div>
      <div class="tbl"><div class="th"><span>STT</span><span>Hàng hóa</span><span style="text-align:right">Vị trí · SL</span></div>
      ${rows.map((r, k) => `<div class="pr"><div class="no">${k + 1}</div>
        <div><div class="nm">${esc(nameOf(r.ma_hang))}</div>
          <div class="mut"><span class="code">${esc(r.ma_hang)}</span>${r.lo ? " · lô " + esc(r.lo) : ""}</div>
          <div style="margin-top:2px">${r.nn ? `<span class="chip gray">Nhập ${esc(r.nn)}</span>` : ""}${r.hsd ? hsdChip(r.hsd) : ""}</div>
          ${r.gc ? `<div class="mut" style="margin-top:2px">📝 ${esc(r.gc)}</div>` : ""}
          ${v.loai === "DOI" ? `<div class="mut" style="margin-top:2px">${r.nhan != null ? "✔ Đã nhận về " + fmt(r.nhan) : "⏳ Chưa nhận hàng về"}</div>` : ""}
          ${r.hm || r.nm ? `<div class="mut" style="margin-top:2px">📅 Đổi ${r.nm ? "NSX → " + esc(r.nm) + " " : ""}${r.hm ? "HSD → " + esc(r.hm) : ""}</div>` : ""}
          ${r.goiy ? `<div class="sug">gợi ý theo ${esc(S.xuatRule)}</div>` : ""}</div>
        <div><div class="lc">${esc(r.vi_tri || "—")}${r.den ? " → " + esc(r.den) : ""}</div>
          <div class="q">${fmt(r.sl)} <span class="mut">${esc(dvt(r.ma_hang))}</span></div>
          ${r.so_sach != null ? `<div style="text-align:right;margin-top:2px">${(() => { const d = Number(r.sl) - Number(r.so_sach);
              return Math.abs(d) < 1e-9 ? `<span class="chip ok" style="margin:0">Đủ</span>` : `<span class="chip ${d < 0 ? "bad" : "warn"}" style="margin:0">${d < 0 ? "Thiếu " + fmt(-d) : "Thừa " + fmt(d)}</span>`; })()}
              <div class="mut">sổ sách ${fmt(r.so_sach)}</div></div>` : ""}</div></div>`).join("")}</div>
      ${canDelete && !draft ? `<p style="margin:20px 0 6px;text-align:center"><button class="btn alt" id="pedit" style="width:100%">✎ Sửa phiếu</button></p>` : ""}
      ${canDelete ? `<p style="margin:8px 0 8px;text-align:center"><button class="btn bad sm" id="pundo">🗑 Xóa phiếu (hoàn lại tồn kho)</button></p>` : ""}
    </div>`;
  document.body.append(el);
  const close = () => { el.remove(); if (S.tab === "nhat") loadPickList(false); else if (S.tab === "phieu") loadVouchers(false); else if (S.tab === "ton") { S.dateCache = null; loadStock(false); } };
  $("#pback", el).onclick = close;
  if ($("#pedit", el)) $("#pedit", el).onclick = () => { el.remove(); openEditVoucher(v, lines, close); };
  const u = $("#pundo", el);
  if (u) u.onclick = async () => {
    if (!confirm(`Xóa phiếu ${v.so}?\nTồn kho sẽ được hoàn lại như trước khi có phiếu này.`)) return;
    busy(u, true, "Đang xóa…");
    try { await rpc("undo_voucher", { p_so: v.so }); toast(`Đã xóa phiếu ${v.so}`); vibrate(20); refreshRef(true); close(); }
    catch (e) { toast(e.message, true); busy(u, false); }
  };
}

    <div class="pl"><div class="card" style="margin-top:0"><label style="margin-top:0">Tên phiếu</label><input id="e-title" value="${esc(v.ghi_chu || "")}" placeholder="VD: Đơn hàng dư ngày 21/10/2026">
      <label>${v.loai === "XUAT" ? "Nơi nhận" : "Nhà cung cấp"}</label><input id="e-dt" value="${esc(v.doi_tac || "")}">
      ${canLines ? `<label>Ngày phiếu</label><input id="e-date" type="date" value="${esc(v.ngay)}">` : ""}</div>
      ${canLines ? `<div class="section">Dòng hàng</div><div id="e-lines"></div>${isN ? `<p><button class="btn alt" id="e-add" style="width:100%">＋ Thêm dòng</button></p>` : ""}
        <div class="hintline">Sửa số lượng / vị trí / ngày sẽ hoàn lại tồn rồi ghi lại cho đúng. Nếu hàng của phiếu này đã được xuất đi thì chỉ sửa được tên phiếu.</div>`
        : `<div class="hintline">Loại phiếu này chỉ sửa được tên phiếu. Muốn đổi dòng hàng hãy xóa rồi lập lại.</div>`}
      <div class="pad-act"></div></div>
    <div class="actbar" style="bottom:0;padding-bottom:calc(10px + env(safe-area-inset-bottom))"><button class="btn" id="esave">💾 LƯU THAY ĐỔI</button></div>`;
  document.body.append(el);
  const back = () => { el.remove(); voucherDetail(v.so); };
  $("#eback", el).onclick = back;
  const draw = () => {
    const box = $("#e-lines", el); if (!box) return;
    box.innerHTML = E.map((l, i) => `<div class="kk"><div class="row" style="align-items:flex-start"><div><div class="nm">${esc(nameOf(l.ma_hang))}</div>
        <div class="mut"><span class="code">${esc(l.ma_hang)}</span>${!isN && l.hsd ? " · HSD " + esc(l.hsd) : ""}</div></div>
        <button class="btn bad sm fit" data-rm="${i}">✕</button></div>
      <div class="grid2"><div><label>Số lượng</label><input type="text" data-num data-f="sl" data-i="${i}" value="${l.sl}"></div>
        <div><label>Vị trí</label>${isN ? `<input data-f="vi_tri" data-i="${i}" autocapitalize="characters" value="${esc(l.vi_tri)}" placeholder="trống = chưa xếp">` : `<div class="code" style="padding-top:12px;font-size:16px">${esc(l.vi_tri || "—")}</div>`}</div></div>
      ${isN ? `<div class="grid2"><div><label>NSX</label><input type="date" data-f="nsx" data-i="${i}" value="${esc(l.nsx)}"></div>
        <div><label>HSD</label><input type="date" data-f="hsd" data-i="${i}" value="${esc(l.hsd)}"></div></div>` : ""}</div>`).join("") || `<div class="empty">Chưa còn dòng nào.</div>`;
  };
  draw();
  const lb = $("#e-lines", el);
  if (lb) {
    lb.oninput = e => { const t = e.target, i = t.dataset.i; if (i == null) return; E[i][t.dataset.f] = t.dataset.f === "sl" ? Number(t.value) : (t.dataset.f === "vi_tri" ? t.value.trim().toUpperCase() : t.value); };
    lb.onchange = e => {
      const t = e.target; if (t.dataset.f !== "nsx") return;
      const days = Number((itemView(E[t.dataset.i].ma_hang) || {}).han_dung) || 0;
      if (days > 0 && t.value) { E[t.dataset.i].hsd = addDaysIso(t.value, days); draw(); }
    };
    lb.onclick = e => { const b = e.target.closest("[data-rm]"); if (!b) return; E.splice(Number(b.dataset.rm), 1); draw(); };
  }
  if ($("#e-add", el)) $("#e-add", el).onclick = () => sheet(`<h3>＋ Thêm dòng vào phiếu</h3>
      <label>Mã hàng</label><div class="row"><input id="am" autocapitalize="characters" placeholder="Quét / gõ mã hoặc tên">${scanBtn("am")}</div><div id="amp"></div>
      <label>Số lượng</label><input id="aq" type="text" data-num autocomplete="off">
      <div class="grid2"><div><label>NSX</label><input id="an" type="date"></div><div><label>HSD</label><input id="ah" type="date"></div></div>
      <label>Vị trí</label><input id="av" autocapitalize="characters" placeholder="trống = chưa xếp">
      <p style="margin-top:12px"><button class="btn" id="aok" style="width:100%">Thêm</button></p>`, (sh, close) => {
    const days = () => Number((itemView($("#am", sh).value) || {}).han_dung) || 0;
    $("#am", sh).oninput = e => renderItemSuggest($("#amp", sh), e.target.value, ma => { $("#am", sh).value = ma; $("#am", sh).dispatchEvent(new Event("input")); $("#aq", sh).focus(); });
    $("#an", sh).onchange = () => { const d = days(); if (d && $("#an", sh).value) $("#ah", sh).value = addDaysIso($("#an", sh).value, d); };
    $("#aok", sh).onclick = () => {
      const it = itemView($("#am", sh).value), q = Number($("#aq", sh).value);
      if (!it) return toast("Mã hàng chưa có trong danh mục.", true);
      if (!(q > 0)) return toast("Nhập số lượng > 0.", true);
      E.push({ ma_hang: it.ma, lo: "", nsx: $("#an", sh).value, hsd: $("#ah", sh).value, vi_tri: $("#av", sh).value.trim().toUpperCase(), sl: q });
      close(); draw();
    };
  });
  $("#esave", el).onclick = async () => {
    const title = $("#e-title", el).value.trim(), dt = $("#e-dt", el).value.trim(), btn = $("#esave", el);
    try {
      if (canLines) {
        if (!E.length) return toast("Phiếu phải còn ít nhất 1 dòng. Muốn bỏ hết thì hãy xóa phiếu.", true);
        if (E.some(l => !(l.sl > 0))) return toast("Số lượng mỗi dòng phải > 0.", true);
      }
      const ngay = canLines ? $("#e-date", el).value : v.ngay;
      const linesChanged = canLines && (JSON.stringify(E) !== orig || ngay !== v.ngay);
      busy(btn, true, "Đang lưu…");
      if (linesChanged) await rpc("edit_voucher", { p_so: v.so, p_ghi_chu: title, p_doi_tac: dt, p_ngay: ngay, p_lines: E.map(l => ({ ...l, ghi_chu: title })) });
      else await rpc("update_voucher_info", { p_so: v.so, p_ghi_chu: title, p_doi_tac: dt });
      toast("Đã lưu thay đổi"); vibrate(20); S.dateCache = null; refreshRef(true); el.remove(); voucherDetail(v.so);
      if (S.tab === "phieu") loadVouchers(false); if (S.tab === "nhat") loadPickList(false);
    } catch (e) { toast(e.message, true); busy(btn, false); }
  };
}

// -------------------------------------------------------------- PWA
let deferredInstall = null;
const isStandalone = () => (window.matchMedia && matchMedia("(display-mode: standalone)").matches) || navigator.standalone === true;
// Nút "Cài": nếu trình duyệt cho phép thì bật hộp thoại cài luôn; không thì hướng dẫn từng bước đúng trình duyệt
async function doInstall() {
  if (deferredInstall) {
    try { await deferredInstall.prompt(); await deferredInstall.userChoice; deferredInstall = null; return; }
    catch { deferredInstall = null; /* không bật được hộp thoại -> hiện hướng dẫn bên dưới */ }
  }
  const ua = navigator.userAgent;
  const inApp = /Zalo|FBAN|FBAV|FB_IAB|Messenger|Instagram|Line\/|Telegram|TikTok|MicroMessenger/i.test(ua);
  const ios = /iPad|iPhone|iPod/.test(ua);
  const url = location.origin + location.pathname;
  const step = (n, t) => `<div class="row" style="align-items:flex-start;margin:8px 0"><span class="chip fit">${n}</span><div>${t}</div></div>`;
  let body;
  if (inApp) {
    body = `<div class="hintline" style="color:var(--warn);font-weight:700">⚠ Bạn đang mở trong ứng dụng khác (Zalo / Facebook…), không cài được từ đây.</div>
      ${step(1, "Bấm nút <b>⋯</b> hoặc <b>⋮</b> ở góc trên")}
      ${step(2, "Chọn <b>Mở bằng trình duyệt</b> (Chrome / Safari)")}
      ${step(3, "Trong trình duyệt, bấm lại nút <b>Cài</b> này")}`;
  } else if (ios) {
    body = `${step(1, "Mở trang này bằng <b>Safari</b>")}
      ${step(2, "Bấm nút <b>Chia sẻ</b> (hình vuông có mũi tên ↑) ở thanh dưới")}
      ${step(3, "Chọn <b>Thêm vào Màn hình chính</b> → <b>Thêm</b>")}`;
  } else {
    body = `${step(1, "Bấm nút <b>⋮</b> (3 chấm) ở góc trên bên phải của trình duyệt")}
      ${step(2, "Chọn <b>Cài đặt ứng dụng</b> hoặc <b>Thêm vào màn hình chính</b>")}
      ${step(3, "Bấm <b>Cài đặt</b> / <b>Thêm</b>. Biểu tượng <b>Kho</b> sẽ hiện ngoài màn hình")}
      <div class="hintline">Nếu menu không có mục trên: bạn từng thêm rồi → xóa biểu tượng cũ ngoài màn hình, mở lại link này bằng Chrome và làm lại.</div>`;
  }
  sheet(`<h3>📲 Cài app về máy</h3><div class="mut" style="margin:2px 0 8px">Cài xong mở như ứng dụng thường, không còn thanh địa chỉ.</div>
    ${body}
    <label>Link ứng dụng</label><input id="lnk" readonly value="${esc(url)}" onclick="this.select()">
    <p><button class="btn" id="cp" style="width:100%">Sao chép link</button></p>`, (el, close) => {
    $("#cp", el).onclick = async () => {
      try { await navigator.clipboard.writeText(url); toast("Đã sao chép link"); } catch { $("#lnk", el).select(); toast("Bấm giữ vào link để sao chép"); }
    };
  });
}
window.addEventListener("beforeinstallprompt", e => {
  e.preventDefault(); deferredInstall = e; const b = $("#install"); if (b && !isStandalone()) b.style.display = "inline-block";
});
window.addEventListener("appinstalled", () => { deferredInstall = null; const b = $("#install"); if (b) b.style.display = "none"; const l = $("#inst-l"); if (l) l.style.display = "none"; toast("Đã cài app Kho"); });
if ("serviceWorker" in navigator) window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));

sb.auth.onAuthStateChange(ev => { if (ev === "SIGNED_OUT" && S._shelled) { S._shelled = false; renderLogin(true); } });
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && S._shelled) refreshRef(false); });
boot().catch(e => { renderLogin(true); toast(e.message, true); });
</script>
</body>
</html>
